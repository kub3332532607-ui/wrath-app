<style>
@font-face{font-family:"GW";src:url(fonts/body.woff2) format("woff2");font-display:swap}

:root{--page:linear-gradient(170deg,#090d2c 0%,#141245 48%,#2b1a66 100%);--solid:#11103c;--glass:rgba(170,182,255,.11);--glass2:rgba(170,182,255,.2);--fg:#eef0ff;--mute:#b1b6e4;--line:rgba(205,214,255,.26);--acc:#a6c2ff;--note:#ffdcef;--gold:#d9b865;--goldt:#ecd38f;--cur:#fff;--navp:rgba(18,17,66,.5);--logo:linear-gradient(170deg,#ff8fce 0%,#d2a6ff 52%,#9fc0ff 100%);--nav:rgba(18,17,66,.72);--r:20px;--t:"SS","GW","Noto Serif TC",serif;--b:"GW","Noto Serif TC","PMingLiU",serif}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--page) fixed;color:var(--fg);font-family:var(--b);line-height:1.85}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
a{color:var(--acc)}
img{display:block;max-width:100%}
.logo{background:var(--logo);-webkit-background-clip:text;background-clip:text;color:transparent}
.fl{position:absolute;pointer-events:none;overflow:visible;filter:drop-shadow(0 2px 6px rgba(20,10,80,.5))}
.turn{transition:transform .7s cubic-bezier(.3,1.4,.5,1);transform-origin:50% 50%}
.view{display:none;min-width:0}.view.on{display:block}
/* nav: icons only, home in the middle */
.nav{position:fixed;z-index:20;background:var(--nav);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center}
.nav button{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;color:var(--mute)}
.nav svg{width:26px;height:26px;opacity:.6;transition:opacity .15s,filter .15s}.nav button:hover svg{opacity:.85}.nav button[aria-current="true"] svg{opacity:1;filter:drop-shadow(0 0 6px rgba(170,180,255,.85))}
.nav button[data-v=home] svg{width:34px;height:34px;overflow:visible;opacity:.85}.nav button[data-v=home][aria-current="true"] svg{opacity:1}
.nav button[aria-current="true"]{color:var(--cur);background:none}.nav button{position:relative}
.nav .hm{width:58px;height:58px;background:radial-gradient(circle at 35% 28%,#8fb2ff,#2545d6 55%,#0b1a78);color:#fff;box-shadow:0 0 0 2px var(--gold),0 0 18px rgba(90,120,255,.7)}
.nav .hm[aria-current="true"]{background:radial-gradient(circle at 35% 28%,#8fb2ff,#2545d6 55%,#0b1a78)}
.nav .hm svg{width:34px;height:34px}
body.full .nav,body.full .fab{display:none}
@media (max-width:899px){.nav{left:14px;right:14px;bottom:calc(10px + env(safe-area-inset-bottom,0px));justify-content:space-around;border:1px solid rgba(217,184,101,.5);border-radius:99px;padding:3px 8px;box-shadow:0 8px 24px rgba(5,5,40,.45)}.nav button{flex:0 1 48px}.nav .hm{flex:none;margin-block:-14px}main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}body.full main{padding-bottom:0}}
@media (min-width:900px){.nav{left:0;top:0;bottom:0;width:80px;flex-direction:column;gap:10px;border-right:1px solid var(--line)}main{margin-left:80px}body.full main{margin-left:0}}
/* opening screen */
.sp{position:relative;overflow:hidden;height:calc(100dvh - 68px - env(safe-area-inset-bottom,0px));min-height:620px;display:grid;grid-template-columns:minmax(0,1fr) 60px;grid-template-rows:minmax(0,1fr) auto minmax(0,1fr);grid-template-areas:"e t" "m t" "w w"}
.pan{position:relative;margin:0;min-height:0;cursor:pointer;background:none;display:block;width:100%;height:100%;filter:drop-shadow(0 0 1px var(--gold)) drop-shadow(0 8px 26px rgba(40,50,190,.6))}
.pan img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 38%}
.pan.e{grid-area:e;clip-path:none}.pan.e img{object-position:50% 62%;clip-path:polygon(0 0,100% 0,100% 82%,0 100%)}
.pan.w{grid-area:w;width:calc(100vw - 96px);justify-self:end}.pan.w img{clip-path:polygon(0 18%,100% 0,100% 100%,0 100%)}
.dots{position:absolute;font-family:var(--t);font-size:1.7rem;line-height:1;color:#1b1f5e;letter-spacing:.1em;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 6px #fff;transition:transform .25s}
.pan.e .dots{right:8%;top:10%}.pan.w .dots{left:7%;top:24%}
.pan.pop .dots{transform:translateY(-8px) scale(1.25)}
.spt{grid-area:t;margin:0;writing-mode:vertical-rl;align-self:center;justify-self:center;font-family:var(--t);font-size:clamp(1.8rem,5dvh,2.5rem);letter-spacing:.08em;line-height:1.1;font-weight:400}
.spm{grid-area:m;position:relative;z-index:3;padding:4px 4px 4px 16px;display:grid;gap:2px}
.spm p{margin:0;color:var(--fg);font-size:.82rem;line-height:1.6}
.brace{position:relative;max-width:420px;width:100%;justify-self:center}
.brace svg{width:100%;height:auto;display:block;overflow:visible}
.wire{stroke:#e8eaff;stroke-width:1;stroke-linejoin:round}[data-mode=light] .wire{stroke:#6f7399}
.brace input{position:absolute;top:0;left:4.6%;width:90.8%;height:100%;opacity:0;margin:0;cursor:ew-resize;touch-action:none}
.rl{text-align:center;font-size:.76rem;color:var(--mute);line-height:1.3}
.sps{grid-area:s;position:absolute;left:0;bottom:6px;width:90px;padding-left:10px;z-index:3;display:grid;gap:6px;font-size:.68rem;line-height:1.2;color:var(--mute)}
.sps b{display:block;font-family:var(--t);font-weight:400;font-size:1.25rem;color:var(--fg)}
.alt{display:none}
@media (min-width:900px){
 .sp{height:100dvh;min-height:600px;grid-template-columns:minmax(0,1fr) minmax(360px,520px) minmax(0,1fr);grid-template-rows:auto auto auto;grid-template-areas:"e t w" "e m w" "e s w";align-content:center;align-items:center}
 .pan.e,.pan.w{grid-row:1/4;width:auto;height:100dvh}
 .pan.e img{clip-path:polygon(0 0,100% 0,84% 100%,0 100%);object-position:46% 50%}
 .pan.w img{clip-path:polygon(16% 0,100% 0,100% 100%,0 100%);object-position:58% 50%}
 .pan.w{justify-self:stretch}
 .pan.e .dots{right:22%;top:8%}.pan.w .dots{left:24%;top:8%}
 .spt{writing-mode:horizontal-tb;font-size:clamp(2.3rem,3.3vw,3.2rem);white-space:nowrap}
 .spm{padding:10px 8px;gap:10px}.spm p{font-size:1rem;line-height:1.85}
 .sps{position:static;width:auto;grid-template-columns:repeat(3,auto);justify-content:center;gap:28px;text-align:center;font-size:.76rem}
 .sps b{font-size:1.6rem}
 .alt{display:block;text-align:center;font-size:.78rem;color:var(--mute)}
}
/* pages */
.pg{position:relative;padding:calc(16px + env(safe-area-inset-top,0px)) 18px 30px;max-width:1120px;margin:0 auto;display:grid;gap:18px}
.pg>*{min-width:0}
.hd{position:relative;display:grid;padding-right:96px}
.hd h2{margin:0;font-family:var(--t);font-size:1.8rem;font-weight:400;letter-spacing:.06em;line-height:1.4}
.hd span{color:var(--mute);font-size:.84rem}
h3{margin:0 0 8px;font-family:var(--t);font-size:1.02rem;font-weight:400;color:var(--acc);letter-spacing:.04em}
.seg2{display:inline-flex;padding:3px;background:var(--glass);border:1px solid var(--line);border-radius:99px;max-width:100%;overflow-x:auto;scrollbar-width:none}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.jump{display:flex;align-items:center;gap:6px;font-size:.84rem;color:var(--mute)}
.jump input{width:68px;min-height:40px;border-radius:99px;border:1px solid var(--line);background:var(--glass);text-align:center}
/* episode chain */
.chain{position:relative;display:grid;columns:auto}
.chain::before{content:"";position:absolute;left:21px;top:0;bottom:0;width:1.5px;background:var(--gold);opacity:.65}
.arc{position:relative;display:flex;align-items:center;gap:10px;min-height:56px;padding-left:2px;font-family:var(--t);font-size:1.08rem}
.arc svg{flex:none;width:40px;height:40px;overflow:visible}
.arc small{font-family:var(--b);font-size:.74rem;color:var(--mute)}
.er{position:relative;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;min-height:60px;text-align:left;padding:7px 8px 7px 0;border-radius:14px}

.er b{font-family:var(--t);font-weight:400;font-size:1.02rem;margin-right:7px}
.er .ex{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:.86rem;line-height:1.55;color:var(--mute)}

.er img{width:42px;height:54px;object-fit:cover;object-position:50% 12%;border-radius:10px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.76rem;color:var(--mute);align-items:center}
.legend i{display:inline-block;margin-right:5px;vertical-align:-2px}
/* full screen episode */
.fbar{position:sticky;top:0;z-index:10;display:grid;grid-template-columns:48px 1fr 48px 48px;align-items:center;gap:2px;padding:calc(6px + env(safe-area-inset-top,0px)) 10px 6px;background:var(--nav);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.fbar.simple{grid-template-columns:48px 1fr 48px}
.ib{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;font-size:1.5rem;line-height:1;color:var(--fg)}
.ib:disabled{opacity:.25}
.fbar .tt{display:flex;align-items:center;justify-content:center;gap:8px;min-width:0;font-family:var(--t);font-size:1.25rem;white-space:nowrap}
.fbar svg{width:34px;height:34px;overflow:visible;flex:none}
.fbar.simple .tt{display:block;font-size:1rem;text-align:center;overflow:hidden;text-overflow:ellipsis}
@media (max-width:760px){.epb.prize .pics{order:2}}
.epb{max-width:1120px;margin:0 auto;padding:18px 18px 40px;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:30px;align-items:start}
.epb.noimg{grid-template-columns:minmax(0,720px);justify-content:center}
.epb>*{min-width:0}
.pics{display:grid;gap:12px}.pics img{width:100%;border-radius:var(--r)}
@media (min-width:900px){.pics{position:sticky;top:80px}}
@media (max-width:760px){.epb{grid-template-columns:minmax(0,1fr);gap:20px}}
.ctx{margin:0 0 14px;color:var(--mute);font-size:.84rem}
.blk{margin-bottom:24px}
.blk p{margin:0 0 8px;line-height:1.95}
.rx{list-style:none;margin:0;padding:0;display:grid;gap:12px;color:var(--note);font-size:1.05rem;line-height:1.8}
.tg{display:inline-block;font-size:.68rem;padding:0 8px;border:1px solid currentColor;border-radius:99px;margin-right:6px;color:var(--mute);line-height:1.6;vertical-align:2px}
.src{font-size:.72rem;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:38px;padding:0 13px;border-radius:99px;background:var(--glass);border:1px solid var(--line);font-size:.86rem;color:var(--acc);text-decoration:none;display:inline-flex;align-items:center}
.feed{columns:3 280px;column-gap:12px}
.card{display:block;width:100%;text-align:left;break-inside:avoid;margin:0 0 12px;padding:13px 15px;background:var(--glass);border:1px solid var(--line);border-radius:var(--r)}

.card .ep{display:block;font-family:var(--t);font-size:.84rem;color:var(--acc)}
.card p{margin:0;color:var(--note);line-height:1.72}
.more{justify-self:center}
.wall{columns:3 170px;column-gap:10px}

.tile img{width:100%;height:auto}
.tile em{position:absolute;left:10px;top:3px;font-family:var(--t);font-style:normal;font-size:1.5rem;color:#fff;text-shadow:0 1px 8px rgba(10,10,60,.95)}
.fab{position:fixed;z-index:15;right:18px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#8fb2ff,#2545d6 60%,#0b1a78);box-shadow:0 0 0 2px var(--gold);color:#fff;font-size:1.8rem;line-height:1}

.addf{display:grid;gap:10px;padding:14px;background:var(--glass);border:1px solid var(--line);border-radius:var(--r)}

.shelf{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin-inline:-18px;padding:2px 18px 8px}
.pp{flex:0 0 150px;text-align:center;padding:10px;background:var(--glass);border:1px solid var(--line);border-radius:var(--r)}

.ring{display:block;width:84px;height:84px;border-radius:50%;background:center/cover var(--glass2);box-shadow:0 0 0 2px var(--gold),0 0 0 5px rgba(9,13,44,.85),0 0 0 6px var(--gold);margin:6px auto 12px}

.round{border-radius:var(--r);width:100%}
/* goods */
.total{position:relative;padding:18px;border-radius:26px;background:linear-gradient(120deg,rgba(201,92,192,.3),rgba(90,111,240,.3));border:1px solid var(--line)}

.tickets{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.tk{position:relative;display:grid;grid-template-columns:62px minmax(0,1fr);text-align:left;background:linear-gradient(120deg,#2a2c7c,#40267f);border-radius:18px;min-height:104px;overflow:hidden;-webkit-mask-image:radial-gradient(circle 9px at 62px 0,transparent 98%,#000),radial-gradient(circle 9px at 62px 100%,transparent 98%,#000);-webkit-mask-composite:source-in;mask-image:radial-gradient(circle 9px at 62px 0,transparent 98%,#000),radial-gradient(circle 9px at 62px 100%,transparent 98%,#000);mask-composite:intersect}

const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}},lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},lsDel=k=>{try{localStorage.removeItem(k)}catch(e){}};

function gate(msg){const m=document.querySelector('#m');m.innerHTML=`<form class="gate" id="gf"><h1>和皇帝一起墮落</h1><label>密碼<input id="gp" type="password" autocomplete="current-password" required></label><button class="chip" id="gb">進入</button><p class="src" id="gm" role="alert">${msg||'這台裝置只要輸入一次。'}</p></form>`;

function fatal(msg){document.querySelector('#m').innerHTML=`<div class="gate"><h1>和皇帝一起墮落</h1><p class="src">${msg}</p><button class="chip" onclick="location.reload()">重新載入</button></div>`;return new Promise(()=>{})}
async function boot(){
 try{CFG=await(await fetch('key.json',{cache:'no-cache'})).json()}catch(e){return fatal('連不上網路，或這個網址還沒設定好。')}

  const c=await dbGet('base:'+BASE);if(c)return JSON.parse(c);

  if(r.status===401||r.status===403||r.status===404){TK=null;lsDel('tk');await gate('金鑰無法使用（可能過期或被撤銷），請重新輸入密碼；不行就要換一把新金鑰。');continue}
  return fatal(`資料庫回應錯誤（${r.status}），請稍後重試。`)}
}

const b64b=async b=>{const u=new Uint8Array(await b.arrayBuffer());let o='';for(let i=0;i<u.length;i+=32768)o+=String.fromCharCode(...u.subarray(i,i+32768));return btoa(o)};
async function getEdits(){const r=await api('edits.json');if(r.status===404){SHA=null;return null}if(!r.ok)throw r;const j=await r.json();SHA=j.sha;
 if(j.content)return JSON.parse(new TextDecoder().decode(unb64(j.content)));const q=await rawGet('edits.json');if(!q.ok)throw q;return q.json()}

async function push(){if(pushing)return;if(!dirty&&!upq.length)return;if(navigator.onLine===false){sync('沒有網路，內容已存在這台，連線後會上傳',true);return}
 pushing=true;const at=gen;let bad=null;try{sync(upq.length?`上傳圖片中，還有 ${upq.length} 張…`:'同步中…');
  while(upq.length){const p=upq[0],b=await dbGet('img:'+p);if(b){const r=await api(p,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'add image',content:await b64b(b)})});if(!r.ok&&r.status!==422)throw r}upq.shift();persist();if(upq.length)sync(`上傳圖片中，還有 ${upq.length} 張…`)}
  if(dirty){let done=false;for(let i=0;i<4&&!done;i++){const rem=await getEdits();E=merge(rem,E);const r=await api('edits.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'update notes',content:b64u(JSON.stringify(E)),...(SHA?{sha:SHA}:{})})});if(r.ok){SHA=(await r.json()).content.sha;done=true}else if(r.status!==409&&r.status!==422)throw r}if(!done)throw new Error('conflict');if(gen===at)dirty=false;persist()}
  if(!dirty&&!upq.length)sync('已同步')}catch(e){bad=e}finally{pushing=false}
 if(bad){if(bad.status===401||bad.status===403||bad.status===404){sync('金鑰無法使用，內容還在這台。請重新整理後再輸入密碼。',true);TK=null;lsDel('tk')}else{sync('上傳失敗，內容還在這台，稍後自動再試',true);clearTimeout(_pt);_pt=setTimeout(push,30000)}}
 else if(dirty||upq.length){clearTimeout(_pt);_pt=setTimeout(push,1500)}}
async function pull(){if(!TK)return;if(dirty||upq.length)return push();if(pushing)return;try{const before=JSON.stringify(E),rem=await getEdits();if(dirty||pushing)return;E=merge(rem,E);const now=JSON.stringify(E);if(now!==before){persist();rebuild();const typing=$('.edm')&&document.activeElement?.matches('input,textarea,select');if(!typing){const y=scrollY;render(true);scrollTo(0,y)}}}catch(e){}}

const URLS=new Map(),INF=new Map(),PH='data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';let _act=0;const _wq=[];
const hy=h=>h.replace(/src="(img\/[^"]+)"/g,(_,p)=>URLS.has(p)?`src="${URLS.get(p)}"`:`src="${PH}" data-p="${p}"`).replace(/url\((img\/[^)]+)\)"/g,(_,p)=>URLS.has(p)?`url(${URLS.get(p)})"`:`url(${PH})" data-bg="${p}"`);
const slot=()=>_act<6?(_act++,Promise.resolve()):new Promise(ok=>_wq.push(ok)),free=()=>{const n=_wq.shift();n?n():_act--};
function loadImg(p){if(URLS.has(p))return Promise.resolve(URLS.get(p));if(INF.has(p))return INF.get(p);const w=(async()=>{let b=await dbGet('img:'+p);if(!b){await slot();try{const r=await rawGet(p);if(!r.ok)throw r;b=await r.blob();b=new Blob([b],{type:'image/jpeg'});dbSet('img:'+p,b)}finally{free()}}const u=URL.createObjectURL(b);URLS.set(p,u);return u})().catch(()=>null).finally(()=>INF.delete(p));INF.set(p,w);return w}
const IO=new IntersectionObserver(es=>es.forEach(x=>{if(!x.isIntersecting)return;IO.unobserve(x.target);const el=x.target,p=el.dataset.p||el.dataset.bg;loadImg(p).then(u=>{if(!u)return;if(el.dataset.p){el.src=u;delete el.dataset.p}else{el.style.backgroundImage=`url(${u})`;delete el.dataset.bg}})}),{rootMargin:'800px'});

/* adding pictures: phone photos shrink to 1600px, name comes from the content so re-adding never doubles */
async function shrink(f){const u=URL.createObjectURL(f);try{const im=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=u}),k=Math.min(1,1600/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);return await new Promise(ok=>c.toBlob(ok,'image/jpeg',.84))}finally{URL.revokeObjectURL(u)}}

function vPrize(i){const p=G.prizes[i],prev=i>0,next=i<G.prizes.length-1;return `<div class="fbar"><button class="ib" onclick="go('goods')" aria-label="回週邊">☰</button><div class="tt">${esc(p.id)}</div><button class="ib" onclick="go('prize-${i-1}')" aria-label="上一項" ${prev?'':'disabled'}>‹</button><button class="ib" onclick="go('prize-${i+1}')" aria-label="下一項" ${next?'':'disabled'}>›</button></div>
 <div class="epb prize"><div class="pics">${p.imgs.map(s=>`<img src="${s}" alt="${esc(p.id)}的圖" loading="lazy">`).join('')}</div><div>
 <h2 style="margin:0;font-family:var(--t);font-weight:400;font-size:1.35rem;line-height:1.5">${esc(p.jp)}</h2><p class="ctx" style="margin-top:2px">${esc(p.zh)}${p.count?'・'+esc(p.count):''}${p.size?'<br>'+esc(p.size):''}</p>
 ${p.thoughts.length?`<div class="blk"><h3>我的感想</h3>${p.thoughts.map(x=>`<p class="note2">${esc(x)}</p>`).join('')}</div>`:''}
 ${p.analysis.length?`<div class="blk"><h3>分析</h3>${p.analysis.map(x=>`<p>${esc(x)}</p>`).join('')}</div>`:''}
 ${p.eps&&p.eps.length?p.eps.map(g=>`<div class="blk"><h3>${esc(g[0])}</h3><div class="chips">${g[1].map(n=>`<button class="chip" onclick="go('ep-${n}')">第${n}話</button>`).join('')}</div></div>`).join(''):''}
 ${p.links.length?`<div class="blk"><h3>連結</h3><div class="chips">${p.links.map(l=>`<a class="chip" href="${l[1]}" target="_blank" rel="noopener">${esc(l[0])}</a>`).join('')}</div></div>`:''}</div></div>`}
function vSlides(){return simpleBar('選圖評價','goods')+`<div class="pg" style="max-width:980px">${G.slides.map(s=>`<img class="round" src="${s}" alt="我整理的週邊選圖與評價">`).join('')}</div>`}
/* people */
function vWorld(){return `<div class="pg"><div class="hd"><h2 class="logo">人物與王國</h2>${spray(110,70,41,'right:-6px;top:-10px')}</div><div><h3>人物</h3><div class="shelf">${D.ppl.map((p,i)=>`<button class="pp" onclick="go('person-${i}')">${p.img?`<i class="ring" style="background-image:url(${p.img})"></i>`:`<i class="ring mono">${esc(p.m)}</i>`}<b>${esc(p.name)}</b><small>${p.role}</small></button>`).join('')}</div></div>
 <div><h3>王國</h3><img class="round" src="${D.map}" alt="第9話的大陸地圖"><div class="chips" style="margin-top:10px">${D.nations.map((n,i)=>`<button class="chip" onclick="go('nation-${i}')">${esc(n.split('：')[0].replace(/（.*/,''))}</button>`).join('')}</div></div></div>`}
function vPerson(i){const p=D.ppl[i];return simpleBar(p.name,'world')+`<div class="pg" style="max-width:640px;text-align:center">${p.img?`<i class="ring" style="width:150px;height:150px;background-image:url(${p.img})"></i>`:`<i class="ring mono" style="width:150px;height:150px;font-size:3rem">${esc(p.m)}</i>`}<p style="margin:0;text-align:left">${esc(p.x)}</p></div>`}
function vNation(i){const[h,...r]=D.nations[i].split('：');return simpleBar(h,'world')+`<div class="pg" style="max-width:640px"><p style="margin:0">${esc(r.join('：')||'這國還沒有資料。')}</p></div>`}
/* nav and routing */
function lilyIcon(){let s='';for(let i=0;i<6;i++)s+=`<path transform="rotate(${i*60} 12 12)" d="M12 12C14 9 14 5 12 2C10 5 10 9 12 12Z"/>`;return s}
const ICON=D.icons;
const TABS=[['wall','圖片牆'],['line','藤蔓劇情線'],['home','主頁'],['goods','展覽'],['world','人物與王國']];
let cur='home';
function toggleMode(){const m=document.documentElement.dataset.mode==='light'?'dark':'light';document.documentElement.dataset.mode=m;window.setBar(m);try{localStorage.setItem('mode',m)}catch(_){}const y=scrollY;render();scrollTo(0,y)}
/* side drawer opened from the avatar; icons are bracelet settings */
const MC=['#eeeaff','#9a97e0','#c9cdfb','#7f7bd6','#b7b3ee','#8a86dc','#dcdcff','#736fce','#c1bde6','#8f8be0','#d4d6fd','#7c78d2'];
const GEMS={
 home:{rim:a=>[Math.cos(a)*16,Math.sin(a)*16],tint:'#7b78e0',rot:0},
 wall:{rim:a=>{const c=Math.cos(a),s=Math.sin(a),e=2/3.4;return[Math.sign(c)*Math.abs(c)**e*14.5,Math.sign(s)*Math.abs(s)**e*14.5]},tint:'#9a6fe0',rot:0},
 world:{rim:a=>{const k=1+.32*Math.sin(a);return[Math.cos(a)*13.5*k*(1-.16*Math.sin(a)),Math.sin(a)*17]},tint:'#b07ae0',rot:0}};
function pearlMd(on){let leaf='';if(on)for(let i=0;i<4;i++)leaf+=`<path transform="rotate(${i*90})" d="M-7 -16Q-3 -20 0 -27Q3 -20 7 -16Q0 -19 -7 -16Z" fill="url(#silver)" stroke="#565a7e" stroke-width=".6"/>`;return `<svg class="md" viewBox="-30 -30 60 60" aria-hidden="true">${leaf}<circle cy="1.6" r="14" fill="#34265f" opacity=".4"/><circle r="13.4" fill="url(#pearl)" stroke="#8d88ab" stroke-width=".4"/><circle cx="-4.4" cy="-4.8" r="3.5" fill="#fff"/><path d="M-8.3 6.2Q0 11.8 8.8 5.1" fill="none" stroke="#f3b9dd" stroke-width="1.3"/></svg>`}
function medal(k,on){if(!GEMS[k])return pearlMd(on);const G=GEMS[k],N=16,pts=(r,sc)=>`${(r[0]*sc).toFixed(2)},${(r[1]*sc).toFixed(2)}`,at=i=>G.rim(i/N*6.2832-1.5708);let f='',leaf='',line=[],bez=[];
 for(let i=0;i<N;i++){const A=at(i),B=at(i+1),M=at(i+.5);f+=`<polygon points="${pts(A,1)} ${pts(B,1)} ${pts(M,.58)}" fill="${MC[i%12]}"/><polygon points="0,0 ${pts(A,.62)} ${pts(B,.62)}" fill="${MC[(i*5+3)%12]}"/><polygon points="${pts(A,1)} ${pts(M,.58)} ${pts(at(i-.5),.58)}" fill="${MC[(i*7+1)%12]}"/>`;line.push(pts(A,1));bez.push(pts(A,1.2))}
 if(on)for(let i=0;i<4;i++)leaf+=`<path transform="rotate(${i*90})" d="M-8 -21Q-3 -24 0 -30Q3 -24 8 -21Q0 -23 -8 -21Z" fill="url(#silver)" stroke="#565a7e" stroke-width=".6"/>`;
 const pr=[2,6,10,14].map(i=>at(i)).map(p=>`<circle cx="${(p[0]*1.08).toFixed(2)}" cy="${(p[1]*1.08).toFixed(2)}" r="1.8" fill="#fff" stroke="#565a7e" stroke-width=".5"/>`).join('');
 return `<svg class="md" viewBox="-30 -30 60 60" aria-hidden="true">${leaf}<g transform="rotate(${G.rot})"><polygon points="${bez.join(' ')}" fill="url(#silver)" stroke="#565a7e" stroke-width=".7" stroke-linejoin="round"/>${f}<polygon points="${line.join(' ')}" fill="${G.tint}" fill-opacity=".2" stroke="#3a3690" stroke-width=".6" stroke-linejoin="round"/><path d="M-8 -5Q-3 -10 4 -8.5Q-2 -6.5 -5 -2Z" fill="#fff" opacity=".88"/>${pr}</g></svg>`}
const DM=[['home','主頁'],['line','藤蔓劇情線'],['wall','圖片牆'],['goods','展覽'],['world','人物與王國']];
function avSmall(){const a=latestAv();return a?`<img src="${a}" alt="">`:`<svg viewBox="-20 -20 40 40" aria-hidden="true">${lily(0,0,18)}</svg>`}
function menu(){const light=document.documentElement.dataset.mode==='light';return `<button class="dwh" data-v="home" aria-label="回主頁"><span class="dwa">${avSmall()}</span><span class="dwi"><b>${ME.name}</b><small>${ME.id}</small></span></button><div class="dwl">${DM.map(([k,l])=>`<button class="dwr" data-v="${k}" ${k===cur?'aria-current="page"':''}>${medal(k,k===cur)}<span>${l}</span></button>`).join('')}<button class="dwr dwm">${pearlMd(false)}<span>切換成${light?'夜':'日'}版</span></button></div>`}
let _back=null;
function openDw(){const d=$('#dw');_back=document.activeElement;d.innerHTML=hy(`<div class="dws" id="dws"></div><aside class="dwp" role="dialog" aria-modal="true" aria-label="選單">${menu()}</aside>`);hydrate();d.classList.add('open');document.body.classList.add('dwo');$('#dws').onclick=closeDw;const on=$('#dw [aria-current]');if(on)on.focus()}
function closeDw(){const d=$('#dw');if(!d.classList.contains('open'))return;d.classList.remove('open');document.body.classList.remove('dwo');if(_back&&_back.focus&&document.contains(_back))_back.focus()}
addEventListener('keydown',e=>{if(e.key==='Escape')closeDw()});
document.addEventListener('click',e=>{const x=e.target;if(x.closest('#pav,#fav')){if(innerWidth<900)openDw();return}if(x.closest('.dwm')){closeDw();toggleMode();return}const b=x.closest('#dw [data-v],#nav [data-v]');if(b){closeDw();if((location.hash.slice(1)||'home')===b.dataset.v)scrollTo(0,0);else go(b.dataset.v)}});
/* small floating avatar on phones: shows once the avatar or back button has scrolled away */
function favSync(){const f=$('#fav');if(!f)return;let show=innerWidth<900&&!$('.fbar');if(show){const a=$('#pav')||$('.ehd');if(a)show=a.getBoundingClientRect().bottom<0}f.classList.toggle('show',show)}
let _ly=0;addEventListener('scroll',()=>{const y=scrollY,f=$('#fav');if(f){if(y>_ly+4)f.classList.add('dim');else if(y<_ly-4)f.classList.remove('dim')}_ly=y;favSync()},{passive:true});addEventListener('resize',favSync);
function nav(){$('#nav').innerHTML=hy(menu());closeDw();$('#fav').innerHTML=hy(avSmall());$('#fav').classList.remove('dim');setTimeout(favSync,0)}
function render(keep){rebuild();const h=location.hash.slice(1)||'home',m=$('#m'),[r,a]=h.split('-');const n=+a;let full=false,html;
 if(r==='ep'&&n===D.eps.length)D.eps.push(blankEp(n));
 if(r==='ep'&&D.eps[n]){html=vEp(n);full=true;cur='eps'}else if(r==='event'&&G.events[n]){html=vEvent(n);full=true;cur='goods'}else if(r==='prize'&&G.prizes[n]){html=vPrize(n);full=true;cur='goods'}else if(r==='slides'){html=vSlides();full=true;cur='goods'}else if(r==='person'&&D.ppl[n]){html=vPerson(n);full=true;cur='world'}else if(r==='nation'&&D.nations[n]){html=vNation(n);full=true;cur='world'}
 else{cur=TABS.some(t=>t[0]===h)?h:'home';html={home:vHome,wall:vWall,line:vLine,goods:vGoods,world:vWorld}[cur]()}
 const wide=cur==='home'||r==='ep';m.innerHTML=hy((cur==='home'&&!full?hero():'')+(wide?`<div class="shell"><div class="mainc">${html}</div>${side()}</div>`:html));document.body.classList.toggle('full',full);nav();hydrate();if(!keep)window.scrollTo(0,0);
 if(r==='ep'&&full)bindEp(n);else if(!full)({home:bindHome,wall:bindWall,line:bindLine})[cur]?.()}
addEventListener('hashchange',()=>{S.edit=null;persist();render()});if(!lsGet('edits'))await pull();render();startSync();
</script></body></html>
