<style>/* ==== CSS 規則（2026-11-11 待辦第14項整理；細節見 最新\交接.md）====
 斷點：主要分界 900px —— 手機版 @media (max-width:899.98px)、桌面版 @media (min-width:900px)；JS 用 innerWidth<900。
   其他已在用的值：600、700、760、1050、1120、1219、1450。新樣式請優先用 900，真的需要時才用上面這些值，不要再發明 859/861 這類相近數字。
   注意：max-width:700 和 min-width:700 在剛好 700px 會同時成立（760 也是），沿用舊行為未改。
 1219：電腦放大用（html 字級 112.5%、選單加寬、時間線與設定頁改兩欄）。
 主題：顏色變數只寫在下面的 :root（夜版）和 html[data-mode=light]（日版）兩條；元件專用的一組顏色（例 --eg-*、--sr-*）也一樣分夜日兩條。
 命名：新 class / 變數加功能前綴（stg-、eg-、sr-、tw-、arc-、lb-、av- …），新增前先搜尋整份檔案避免撞名。
 順序：同一個選擇器不要在後面另開一條覆蓋前面；要改就改原來那條。*/
@font-face{font-family:"GW";src:url(fonts/body.woff2) format("woff2");font-display:swap}
@font-face{font-family:"JP";src:url(fonts/jp.woff2) format("woff2");font-display:swap}
@font-face{font-family:"LG";src:url(fonts/logo.woff2) format("woff2");font-display:swap}
@font-face{font-family:"SS";src:url(fonts/title.woff2) format("woff2");font-display:swap}
/* 主題變數（夜版預設；日版在下一行覆蓋）。新增顏色請加在這兩條，不要另開 :root */
:root{--page:linear-gradient(170deg,#090d2c 0%,#141245 48%,#2b1a66 100%);--solid:#11103c;--glass:rgba(170,182,255,.11);--glass2:rgba(170,182,255,.2);--fg:#eef0ff;--mute:#b1b6e4;--line:rgba(205,214,255,.26);--acc:#a6c2ff;--note:#ffdcef;--gold:#d9b865;--goldt:#ecd38f;--cur:#fff;--navp:rgba(18,17,66,.5);--logo:linear-gradient(170deg,#ff8fce 0%,#d2a6ff 52%,#9fc0ff 100%);--nav:rgba(18,17,66,.72);--r:20px;--t:"SS","GW","Noto Serif TC",serif;--b:"GW","Noto Serif TC","PMingLiU",serif;--dim:#b1b6e4;--eg-glass:rgba(170,182,255,.13);--eg-glass2:linear-gradient(150deg,rgba(186,178,255,.16),rgba(150,140,240,.08));--eg-edge:rgba(185,166,122,.5);--eg-shine:rgba(224,224,255,.28);--eg-shadow:rgba(5,6,21,.3);--mp-f:#5560a8;--mp-u:#7f88c6;--mp-sea:linear-gradient(170deg,color-mix(in srgb,var(--solid) 86%,#4a5cc0),var(--solid));--hr-r1:#0d1f8c;--hr-r2:#2545d6;--hr-r3:#5a82ff;--hr-t1:#1a35b4;--hr-t2:#3556e6;--hr-t3:#9db4ff;--hr-rl:#f0d484;--hr-rs:#0b1266;--hr-rf:#08125e;--hr-ro:#0b1266;--hr-j1:#fffbe6;--hr-j2:#f6d97f;--hr-j3:#d9a93f}
html[data-mode=light]{color-scheme:light;--fg:#1b1d57;--mute:#555894;--acc:#2743c4;--note:#7c1f7b;--gold:#b78f3c;--goldt:#8a6414;--cur:#1b1d57;--logo:linear-gradient(115deg,#e0237f 0%,#b12fb6 42%,#3d55e6 100%);--dim:#6a70b4;--page:linear-gradient(168deg,#fffdf8 0%,#fbf6ee 50%,#f9f0ea 100%);--solid:#fbf6ee;--glass:rgba(255,255,255,.64);--glass2:rgba(255,255,255,.9);--line:rgba(128,112,126,.25);--navp:rgba(255,252,246,.55);--nav:rgba(255,251,245,.8);--eg-glass:rgba(255,255,255,.6);--eg-glass2:linear-gradient(150deg,rgba(255,255,255,.78),rgba(243,238,255,.62));--eg-edge:rgba(183,143,60,.42);--eg-shine:rgba(255,255,255,.96);--eg-shadow:rgba(120,100,130,.16);--mp-f:#a9b3ec;--mp-u:#cdd2f2;--mp-sea:linear-gradient(170deg,#fffdf8,#f3ecf4);--hr-r1:#c8c0ea;--hr-r2:#e4def8;--hr-r3:#f7f4ff;--hr-t1:#cfc7ee;--hr-t2:#e6e1f8;--hr-t3:#faf8ff;--hr-rl:#c9a24e;--hr-rs:#b8954d;--hr-rf:#a99fd6;--hr-ro:#f7f4ff;--hr-j1:#3556e6;--hr-j2:#2a45c8;--hr-j3:#1a2f9c}
*{box-sizing:border-box}
html{height:100%;color-scheme:dark}
/* 電腦放大（2026-11-12，V1）：≥1219 全站字級與左側選單放大約 112%（rem 一起放大）；手機與窄電腦不變 */
@media (min-width:1219px){html{font-size:112.5%;--sb:clamp(200px,15.6vw,230px)}}
body{margin:0;min-height:100%;background:var(--page) fixed;color:var(--fg);font-family:var(--b);line-height:1.85}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
a{color:var(--acc)}
img{display:block;max-width:100%}
.logo{background:var(--logo);-webkit-background-clip:text;background-clip:text;color:transparent}
.fl{position:absolute;pointer-events:none;overflow:visible;filter:drop-shadow(0 2px 6px rgba(20,10,80,.5))}
.turn{transition:transform .7s cubic-bezier(.3,1.4,.5,1);transform-origin:50% 50%}
.view{display:none;min-width:0}
.view.on{display:block}
.cfg .cfg-c{display:grid;gap:8px;max-width:640px}
.cfg h3{margin:0;font-family:var(--t);font-size:1.05rem}
.cfg .cfg-c p{margin:0;color:var(--mute);font-size:.92rem}
@media (min-width:1219px){.cfg{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:18px}.cfg>.hd{grid-column:1/-1}.cfg .cfg-c{max-width:none}.cfg>section:last-child{grid-column:1/-1}}
.cfg-l{display:flex;align-items:center;gap:14px;cursor:pointer}
.cfg-t{flex:1;display:grid;gap:2px}
.cfg-t small{color:var(--mute);font-size:.84rem;line-height:1.6}
.cfg-l input{position:absolute;opacity:0;width:1px;height:1px}
.cfg-s{flex:none;position:relative;width:52px;height:30px;border-radius:99px;background:var(--glass2);border:1px solid var(--line);transition:background .2s}
.cfg-s::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ece8f6 55%,#a9a3c6);box-shadow:0 1px 3px rgba(20,10,80,.4);transition:transform .2s}
.cfg-l input:checked+.cfg-s{background:var(--acc)}
.cfg-l input:checked+.cfg-s::after{transform:translateX(22px)}
.cfg-l input:focus-visible+.cfg-s{outline:2px solid var(--acc);outline-offset:2px}
.cfg-b{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.cfg-b small{color:var(--mute)}
.cfg-v{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:0;font-size:.92rem}
.cfg-v dt{color:var(--mute)}
.cfg-v dd{margin:0;word-break:break-all}
.brace input:disabled{cursor:default}
@media (prefers-reduced-motion:reduce){.cfg-s,.cfg-s::after{transition:none}
.turn{transition:none}}
/* nav: icons only, home in the middle */
.nav{position:fixed;z-index:20;background:var(--nav);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center}
.nav button{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;color:var(--mute);position:relative}
.nav svg{width:26px;height:26px;opacity:.6;transition:opacity .15s,filter .15s}
.nav button:hover svg{opacity:.85}
.nav button[aria-current="true"] svg{opacity:1;filter:drop-shadow(0 0 6px rgba(170,180,255,.85))}
.nav button[data-v=home] svg{width:34px;height:34px;overflow:visible;opacity:.85}
.nav button[data-v=home][aria-current="true"] svg{opacity:1}
.nav button[aria-current="true"]{color:var(--cur);background:none}
body.full .nav,body.full .fab{display:none}
@media (max-width:899.98px){.nav{bottom:calc(10px + env(safe-area-inset-bottom,0px));border-radius:99px;left:50%;right:auto;width:max-content;gap:4px;justify-content:center;padding:1px 8px;background:var(--navp);border:1px solid var(--line);box-shadow:none;transform:translateX(-50%);transition:transform .25s ease;display:none!important}
body.full main{padding-bottom:0}
.nav.hid{transform:translate(-50%,calc(100% + 34px))}
.nav button[data-v=home] svg{width:28px;height:28px}
main{padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
.pfh::after{content:"";display:block;clear:both}
.sr-room .sr-heading h1{margin:0 0 2px}
.sr-room .sr-heading p{margin:0}}
@media (min-width:900px){.nav{flex-direction:column;gap:10px}
.pics{position:sticky;top:80px}
.col{border-inline:1px solid var(--line)}
.fbar{max-width:620px}
.st{padding:8px 0}
:root{--sb:clamp(170px,15vw,196px)}
.nav .dwh .dwa{width:68px;height:68px}
.nav .dwl::before{left:15px;top:22px;bottom:22px}
.nav button.dwr svg.md,.nav button.dwr:hover svg.md{width:44px;height:44px;opacity:1;filter:drop-shadow(0 2px 4px rgba(20,15,90,.4))}
.dw{display:none}
.fab.wl-pearl{right:18px}}
/* opening screen */
.sp{position:relative;overflow:hidden;height:calc(100dvh - 68px - env(safe-area-inset-bottom,0px));min-height:620px;display:grid;grid-template-columns:minmax(0,1fr) 60px;grid-template-rows:minmax(0,1fr) auto minmax(0,1fr);grid-template-areas:"e t" "m t" "w w"}
.brace{position:relative;max-width:420px;width:100%;justify-self:center}
.brace svg{width:100%;height:auto;display:block;overflow:visible}
.brace input{position:absolute;top:0;height:100%;opacity:0;margin:0;cursor:ew-resize}
.rl{text-align:center;font-size:.76rem;color:var(--mute);line-height:1.3}
.sps{grid-area:s;position:absolute;left:0;bottom:6px;width:90px;padding-left:10px;z-index:3;display:grid;gap:6px;font-size:.68rem;line-height:1.2;color:var(--mute)}
.sps b{display:block;font-family:var(--t);font-weight:400;font-size:1.25rem;color:var(--fg)}
.alt{display:none}
@media (min-width:900px){.sp{height:100dvh;min-height:600px;grid-template-columns:minmax(0,1fr) minmax(360px,520px) minmax(0,1fr);grid-template-rows:auto auto auto;grid-template-areas:"e t w" "e m w" "e s w";align-content:center;align-items:center}
.sps{position:static;width:auto;grid-template-columns:repeat(3,auto);justify-content:center;gap:28px;text-align:center;font-size:.76rem}
.sps b{font-size:1.6rem}
.alt{display:block;text-align:center;font-size:.78rem;color:var(--mute)}}
/* pages */
.pg{position:relative;padding:calc(16px + env(safe-area-inset-top,0px)) 18px 30px;max-width:1120px;margin:0 auto;display:grid;gap:18px}
.pg>*{min-width:0}
.hd{position:relative;display:grid;padding-right:96px}
.hd h2{margin:0;font-family:var(--t);font-size:1.8rem;font-weight:400;letter-spacing:.06em;line-height:1.4}
.hd span{color:var(--mute);font-size:.84rem}
h3{margin:0 0 8px;font-family:var(--t);font-size:1.02rem;font-weight:400;color:var(--acc);letter-spacing:.04em}
.seg2{display:inline-flex;padding:3px;background:var(--glass);border:1px solid var(--line);border-radius:99px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg2 button{flex:none;min-height:36px;padding:0 13px;border-radius:99px;font-size:.84rem;color:var(--mute)}
.seg2 button.on{background:var(--fg);color:var(--solid)}
/* episode chain */
.chain{position:relative;display:grid;columns:auto}
.chain::before{content:"";position:absolute;left:21px;top:0;bottom:0;width:1.5px;background:var(--gold);opacity:.65}
.arc{position:relative;display:flex;align-items:center;gap:10px;min-height:56px;padding-left:2px;font-family:var(--t);font-size:1.08rem}
.arc svg{flex:none;width:40px;height:40px;overflow:visible}
.arc small{font-family:var(--b);font-size:.74rem;color:var(--mute)}
/* full screen episode */
.fbar{position:sticky;top:0;z-index:10;display:grid;grid-template-columns:48px 1fr 48px 48px;align-items:center;gap:2px;padding:calc(6px + env(safe-area-inset-top,0px)) 10px 6px;background:var(--nav);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.fbar.simple{grid-template-columns:48px 1fr 48px}
.ib{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;font-size:1.5rem;line-height:1;color:var(--fg)}
.ib:disabled{opacity:.25}
.fbar .tt{display:flex;align-items:center;justify-content:center;gap:8px;min-width:0;font-family:var(--t);font-size:1.25rem;white-space:nowrap}
.fbar svg{width:34px;height:34px;overflow:visible;flex:none}
.fbar.simple .tt{display:block;font-size:1rem;text-align:center;overflow:hidden;text-overflow:ellipsis}
@media (max-width:760px){.epb.prize .pics{order:2}}
.epb{max-width:1120px;margin:0 auto;padding:18px 18px 40px;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:30px;align-items:start}
.epb>*{min-width:0}
.pics{display:grid;gap:12px}
.pics img{width:100%;border-radius:var(--r)}
@media (max-width:760px){.epb{grid-template-columns:minmax(0,1fr);gap:20px}}
.ctx{margin:0 0 14px;color:var(--mute);font-size:.84rem}
.blk{margin-bottom:24px}
.blk p{margin:0 0 8px;line-height:1.95}
.rx{list-style:none;margin:0;padding:0;display:grid;gap:12px;color:var(--note);font-size:1.05rem;line-height:1.8}
.tg{display:inline-block;font-size:.68rem;padding:0 8px;border:1px solid currentColor;border-radius:99px;margin-right:6px;color:var(--mute);line-height:1.6;vertical-align:2px}
.src{font-size:.72rem;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:38px;padding:0 13px;border-radius:99px;background:var(--glass);border:1px solid var(--line);font-size:.86rem;color:var(--acc);text-decoration:none;display:inline-flex;align-items:center}
.feed{columns:3 280px;column-gap:12px}
.card{display:block;width:100%;text-align:left;break-inside:avoid;margin:0 0 12px;padding:13px 15px;background:var(--glass);border:1px solid var(--line);border-radius:var(--r)}
.card:hover{background:var(--glass2)}
.card .ep{display:block;font-family:var(--t);font-size:.84rem;color:var(--acc)}
.card p{margin:0;color:var(--note);line-height:1.72}
.more{justify-self:center}
.wall{columns:3 170px;column-gap:10px}
.tile{position:relative;display:block;width:100%;margin:0 0 26px;break-inside:avoid;border-radius:14px}
.tile img{width:100%;height:auto;border-radius:14px;box-shadow:0 0 0 1.5px var(--gold),0 0 0 4px var(--solid),0 0 0 5px color-mix(in srgb,var(--gold) 70%,transparent)}
.tile em{position:absolute;left:50%;bottom:-13px;transform:translateX(-50%);padding:0 10px;border-radius:8px;background:var(--solid);font-family:var(--t);font-style:normal;font-size:.78rem;letter-spacing:.1em;line-height:1.6;white-space:nowrap;color:var(--goldt)}
.fab{position:fixed;z-index:15;right:18px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#8fb2ff,#2545d6 60%,#0b1a78);box-shadow:0 0 0 2px var(--gold);color:#fff;font-size:1.8rem;line-height:1}
@media (min-width:900px){.fab{bottom:28px;right:28px}}
.addf{display:grid;gap:10px;padding:14px;background:var(--glass);border:1px solid var(--line);border-radius:var(--r)}
.addf label{display:grid;gap:3px;font-size:.86rem}
.addf input{min-height:44px;padding:6px 12px;border-radius:14px;border:1px solid var(--line);background:var(--glass)}
.ring{display:block;width:84px;height:84px;border-radius:50%;background:center/cover var(--glass2);box-shadow:0 0 0 2px var(--gold),0 0 0 5px rgba(9,13,44,.85),0 0 0 6px var(--gold);margin:6px auto 12px}
.ring.mono{display:grid;place-items:center;font-family:var(--t);font-size:1.7rem;color:var(--goldt);font-style:normal}
/* mp-: the map on the people & kingdoms page (traced border lines, numbered gold markers, legend) */
.mp-hd{display:flex;align-items:center;justify-content:flex-end;margin-top:-6px}
.mp-vp{overflow:hidden;border-radius:var(--r);border:1px solid var(--line);background:var(--mp-sea)}
.mp-vp.mp-z{overflow:auto;-webkit-overflow-scrolling:touch}
.mp-wrap{position:relative;width:100%}.mp-vp.mp-z .mp-wrap{width:230%}
.mp-svg{display:block;width:100%;height:auto}
.mp-r{fill:var(--mp-f);stroke:var(--mp-f);stroke-width:1px;stroke-linejoin:round;vector-effect:non-scaling-stroke;cursor:pointer}
.mp-r.mp-u{fill:var(--mp-u);stroke:var(--mp-u)}
.mp-bd{fill:none;stroke:var(--fg);stroke-opacity:.72;stroke-width:1.2px;vector-effect:non-scaling-stroke;pointer-events:none;stroke-linejoin:round}
.mp-sl{fill:none;stroke:var(--goldt);stroke-width:3px;vector-effect:non-scaling-stroke;pointer-events:none;filter:drop-shadow(0 0 5px var(--gold));stroke-linejoin:round}
.mp-k{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;padding:0;border:0;background:none;display:grid;place-items:center;cursor:pointer;color:var(--fg);font:inherit}
.mp-e .mp-k{touch-action:none;cursor:grab}
.mp-n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--t);font-size:.9rem;line-height:1;color:var(--goldt);background:var(--solid);box-shadow:0 0 0 1.5px var(--gold),0 0 0 3.5px var(--solid),0 3px 10px rgba(10,10,60,.45);flex:none}
.mp-k.mp-s .mp-n,.mp-c.mp-s .mp-n{background:var(--gold);color:var(--solid)}
.mp-lg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 10px;margin-top:12px}
.mp-c{min-height:52px;padding:6px 12px 6px 8px;border-radius:99px;background:var(--glass);border:1px solid var(--line);font:inherit;font-size:.86rem;color:var(--acc);display:flex;align-items:center;gap:10px;text-align:left;cursor:pointer}
.mp-lg .mp-n{box-shadow:0 0 0 1.5px var(--gold),0 0 0 3.5px var(--solid)}
.mp-c.mp-s{border-color:var(--gold)}.mp-c.mp-o{opacity:.7;border-style:dashed}.mp-c.mp-w{grid-column:1/-1}
.mp-tx{display:flex;flex-direction:column;gap:3px;line-height:1.25;min-width:0;overflow-wrap:anywhere}.mp-tx>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mp-tx small{font-size:.68rem;color:var(--mute);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mp-st{margin-top:10px;padding:10px 14px;border-radius:var(--r);background:var(--glass);border:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.mp-st p{margin:0;flex:1 1 150px;font-size:.88rem;overflow-wrap:anywhere}.mp-st small{display:block;color:var(--mute);font-size:.72rem}
.mp-b{min-height:44px;padding:0 14px;border-radius:99px;background:var(--glass2);border:1px solid var(--line);color:var(--acc);font:inherit;font-size:.84rem;cursor:pointer}
/* wd-: people and nations (family tree, relation star, court chart). Rings sit on the page itself, like the home avatar: thin gold line + a rim in the page colour */
.ring.wd-r{width:var(--z);height:var(--z);margin:0;flex:none;box-shadow:0 0 0 max(1.5px,calc(var(--z)/34)) var(--gold),0 0 0 calc(var(--z)/11) var(--solid);background-color:var(--solid)}
.ring.mono.wd-r{background:linear-gradient(var(--glass2),var(--glass2)),var(--solid);font-size:calc(var(--z)/2.6)}
.wd-hd b,.wd-n b,.wd-o b,.wd-s b{display:block;font-family:var(--t);font-weight:400;line-height:1.3}

function prepTea(){const sig=teaSig();if(studyTeaSig!==sig)studyTeaURL=null;if(!studyTeaURL){studyTeaSig=sig;const av=D.ppl.filter(p=>p.av);studyTeaURL=(async()=>{const r=await rawGet('data/study-tea.html');if(!r.ok)throw Error('讀取失敗');let t=(await r.text()).split('__FONTS__').join(new URL('fonts',location.href).href);const ps=[...new Set(t.match(/img\/[0-9a-f]{16}\.(?:jpg|png)/g)||[])];const m=new Map(await Promise.all(ps.map(async p=>[p,await loadImg(p)])));if(ps.some(p=>!m.get(p)))throw Error('圖片讀取失敗');for(const p of av){const u=await loadImg(p.img);if(u)for(const k of new Set([p.bn,p.name]))if(k)t=t.split('"k":'+JSON.stringify(k)+',"i":"').map((x,j)=>j?u+x.slice(x.indexOf('"')):x).join('"k":'+JSON.stringify(k)+',"i":"')}t=t.replace(/img\/[0-9a-f]{16}\.(?:jpg|png)/g,p=>m.get(p));return URL.createObjectURL(new Blob([t],{type:'text/html'}))})();studyTeaURL.catch(()=>{studyTeaURL=null})}return studyTeaURL}
async function attachStudyTea(){const frame=document.querySelector('.sr-tea');if(!frame||frame.dataset.loading)return;frame.dataset.loading='1';try{const url=await prepTea();if(frame.isConnected)frame.src=url}catch(e){studyTeaURL=null;if(frame.isConnected){const p=document.createElement('p');p.className='pg';p.textContent='溫室載入失敗，請重新整理後再試。';frame.replaceWith(p)}}}

const FXR=matchMedia('(prefers-reduced-motion: reduce)');let FX=null,fxEmblem='';
const FXT={study:['書房','支出報告'],tea:['溫室','茶會與吐槽'],};
function fxMark(k){const[n,s]=FXT[k];return `<div class="fx-mark">${fxEmblem?`<img class="fx-emb" src="${fxEmblem}" alt="">`:''}<b class="fx-name">${n}</b><i class="fx-line"></i><small>${s}</small></div>`}
function fxPetals(){let s='';for(let i=0;i<9;i++){const x=6+i*11+Math.random()*6,r=Math.random()*360,L=18+Math.random()*14;s+=`<svg style="left:${x}%;--d:${(1.3+Math.random()*.7).toFixed(2)}s;--w:${(Math.random()*.35).toFixed(2)}s;--dx:${Math.round(-90+Math.random()*60)}px;--dy:${Math.round(55+Math.random()*35)}vh;--r0:${Math.round(r)}deg;--r1:${Math.round(r+90+Math.random()*120)}deg" width="${L}" height="${L}" viewBox="${-L/2} ${-L} ${L} ${L}"><path d="${petal(L,L*.32)}" fill="url(#pg)" fill-opacity=".8" stroke="#fff" stroke-opacity=".7" stroke-width=".6"/></svg>`}return `<div class="fx-petals">${s}</div>`}
function fxEnd(fast){const f=FX;if(!f)return;FX=null;f.timers.forEach(clearTimeout);removeEventListener('keydown',f.key,true);const el=f.el;if(!el.isConnected)return;el.classList.add('out');if(fast===0){el.remove();return}el.animate([{opacity:getComputedStyle(el).opacity},{opacity:0}],{duration:fast?160:FXR.matches?220:380,easing:'ease-out',fill:'forwards'}).onfinish=()=>el.remove()}
function fxStart(kind,target,o){fxEnd(0);const el=document.createElement('div');el.className='fx fx-'+kind;el.setAttribute('aria-hidden','true');const f=FX={el,target,timers:[],switched:!!o.switched,ready:!o.wait,min:0};
 const T=(fn,ms)=>f.timers.push(setTimeout(()=>{if(FX===f)fn()},ms));f.T=T;
 f.go=()=>{if(f.switched)return;f.switched=true;go(target)};
 f.finish=()=>{if(FX!==f)return;if(f.ready&&performance.now()>=f.min)fxEnd()};
 f.skip=()=>{f.go();fxEnd(true)};
 el.addEventListener('pointerdown',e=>{e.preventDefault();f.skip()});
 f.key=e=>{if(['Shift','Control','Alt','Meta'].includes(e.key))return;f.skip()};addEventListener('keydown',f.key,true);
 document.body.append(el);T(()=>{f.go();fxEnd(true)},o.cap||2600);return f}
function fxRoom(kind,fx){if(FX&&FX.target===kind)return;if(fx&&fx.emblem)fxEmblem=fx.emblem;if(kind==='tea')prepTea();const reduce=FXR.matches,frame=document.querySelector('.sr-entry'),fr=frame&&frame.getBoundingClientRect();
 if(reduce&&kind==='study'){fxEnd(0);go(kind);return}
 const f=fxStart(kind,kind,{wait:kind==='tea',cap:reduce?2400:2800}),el=f.el,vw=innerWidth,vh=innerHeight;
 const veil=document.createElement('div');veil.className='fx-veil';el.append(veil);
 if(reduce){veil.innerHTML=fxMark(kind);f.go();f.min=performance.now()+200;return}
 let art=null;
 if(fx&&fx.img&&fr&&fx.rect&&fx.box){const[l,t,w,h]=fx.rect,X=fr.left+l,Y=fr.top+t,[bx,by,bw,bh]=fx.box,ix=X+bx,iy=Y+by;
  if(w>20&&h>20&&bw>0&&bh>0){art=document.createElement('div');art.className='fx-art';art.innerHTML='<img alt="">';const im=art.firstChild;im.src=fx.img;Object.assign(im.style,{left:ix+'px',top:iy+'px',width:bw+'px',height:bh+'px',filter:fx.filter||''});el.prepend(art);
   const cT=Math.max(0,Y-iy),cB=Math.min(bh,Y+h-iy),k=Math.max(vw/bw,vh/Math.max(1,cB-cT),1.25)*1.04,u=(X+w/2-ix)/bw,v=(Y+h/2-iy)/bh,nx=Math.min(0,Math.max(vw-bw*k,vw/2-u*bw*k)),ny=Math.min(-cT*k,Math.max(vh-cB*k,vh/2-v*bh*k)),ease='cubic-bezier(.65,0,.3,1)';
   art.animate([{clipPath:`inset(${Y}px ${vw-X-w}px ${vh-Y-h}px ${X}px)`},{clipPath:'inset(0px 0px 0px 0px)'}],{duration:560,easing:ease,fill:'forwards'});
   im.animate([{transform:'none'},{transform:`translate(${nx-ix}px,${ny-iy}px) scale(${k})`}],{duration:900,easing:'cubic-bezier(.5,0,.2,1)',fill:'forwards'})}}
 const vIn=art?260:0,sw=art?600:320;
 veil.style.opacity=0;f.T(()=>{veil.innerHTML=fxMark(kind)+(kind==='tea'?fxPetals():'');veil.animate([{opacity:0},{opacity:1}],{duration:art?340:260,easing:'ease-out',fill:'forwards'})},vIn);
 f.T(()=>{f.go();f.min=performance.now()+(art?180:260);f.T(f.finish,f.min-performance.now()+5)},sw)}
function fxBack(){const reduce=FXR.matches,f=fxStart('goods','goods',{switched:true,wait:true,cap:1800}),veil=document.createElement('div');veil.className='fx-veil';f.el.append(veil);f.min=performance.now()+(reduce?120:260);f.T(f.finish,f.min-performance.now()+5)}
